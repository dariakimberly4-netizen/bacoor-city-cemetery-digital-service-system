<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b2f5b">
<link rel="manifest" href="manifest.webmanifest">
<title>Bacoor City Cemetery Digital Service System</title>
<style>
:root{--navy:#0b2f5b;--blue:#174f93;--gold:#c9a24d;--bg:#eef2f6;--ink:#1f2933;--muted:#6b7785;--line:#dde3ea;--white:#fff;--green:#2d7a4b;--red:#a23d3d;--shadow:0 10px 28px rgba(21,38,58,.10)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700}.primary{background:var(--navy);color:#fff}.soft{background:#edf2f7;color:var(--navy)}.gold{background:var(--gold);color:#17263b}.danger{background:#f8eaea;color:var(--red)}
.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,#0b2f5b,#174f93 64%,#dcc17c)}.login-card{width:min(460px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 24px 60px rgba(0,0,0,.23)}.seal{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--navy);border:5px solid var(--gold);color:#fff;font-weight:800;letter-spacing:.08em}.login h1{color:var(--navy);font-size:27px;margin:16px 0 6px}.muted,.small{color:var(--muted)}.small{font-size:12px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.demo{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}.demo button{flex:1}
.shell{min-height:100vh;display:grid;grid-template-columns:255px 1fr}.sidebar{background:var(--navy);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh}.brand{padding:8px 9px 18px;border-bottom:1px solid rgba(255,255,255,.16);margin-bottom:14px}.brand b{display:block}.brand span{font-size:12px;color:#cbd9e7}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#eaf1f8;text-align:left;border-radius:9px;padding:11px 12px;font-weight:650}.nav button:hover,.nav button.active{background:rgba(255,255,255,.12)}
main{padding:24px 28px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.top h2{margin:0;color:var(--navy)}.user{display:flex;gap:9px;align-items:center;background:#fff;border-radius:12px;padding:8px 10px;box-shadow:var(--shadow)}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--navy);font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card,.panel{background:#fff;border:1px solid #edf0f4;border-radius:15px;box-shadow:var(--shadow)}.card{padding:17px}.metric{font-size:28px;font-weight:800;color:var(--navy);margin-top:6px}.panel{padding:18px}.panel h3{margin:0 0 14px;color:var(--navy)}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}.toolbar input,.toolbar select{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #edf0f3;text-align:left;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#65717d}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.review{background:#eaf1ff;color:#244d94}.payment{background:#f1eaff;color:#6b43a6}.approval{background:#edf3f7;color:#3b5872}.ready{background:#e6f6ec;color:#216a3f}.released{background:#dff3e7;color:#1b6339}.pending{background:#fff1cc;color:#7a5a0f}
.services,.inventory{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.service,.slot{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}.service b,.slot b{color:var(--navy)}.service:hover{border-color:var(--blue)}.slot.available{background:#eff9f3;border-color:#c2e0cc}.slot.reserved{background:#fff6df;border-color:#ead08e}.slot.occupied{background:#f2f3f5;color:#7b858f}.reqs{display:grid;gap:7px}.req{display:flex;gap:9px;padding:9px;border:1px solid var(--line);border-radius:9px}.note{padding:11px 12px;border-radius:10px;background:#fff7df;border:1px solid #ead8a2;color:#6b5219;font-size:13px}.ok{background:#ebf7ef;border-color:#c8e7d2;color:#245d3b}.kv{display:grid;grid-template-columns:165px 1fr;gap:7px 14px;font-size:13px}.kv div:nth-child(odd){font-weight:700;color:#4d5965}.steps{display:flex;gap:6px;flex-wrap:wrap}.step{padding:7px 9px;border-radius:9px;background:#eef2f6;color:#6d7782;font-size:11px}.step.current{background:#e8f0ff;color:#234b92;font-weight:800}.step.done{background:#e7f6ec;color:#216a3f}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.full{grid-column:1/-1}
.modalback{position:fixed;inset:0;background:rgba(8,20,35,.54);display:grid;place-items:center;padding:16px;z-index:20}.modal{width:min(860px,100%);max-height:91vh;overflow:auto;background:#fff;border-radius:17px;box-shadow:0 25px 65px rgba(0,0,0,.28)}.modalhead,.modalfoot{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;position:sticky;z-index:2}.modalhead{top:0;border-bottom:1px solid #edf0f3}.modalfoot{bottom:0;border-top:1px solid #edf0f3;justify-content:flex-end}.modalbody{padding:18px}.x{border:0;border-radius:8px;background:#eef2f6;padding:8px 10px}.printbox{padding:20px;border:1px dashed #98a5b3;border-radius:13px}.mobile{display:none}
@media(max-width:950px){.shell{grid-template-columns:1fr}.sidebar{display:none}main{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.mobile{display:inline-block}}@media(max-width:620px){.cards,.services,.formgrid{grid-template-columns:1fr}.inventory{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.kv{grid-template-columns:1fr}.full{grid-column:auto}}@media print{.sidebar,.top,.modalfoot,.btn,.x,.toolbar{display:none!important}body{background:#fff}.panel,.card,.modal{box-shadow:none;border:0}.modalbody{padding:0}}
</style>
</head>
<body>
<section id="login" class="login"><div class="login-card"><div class="seal">BCO</div><h1>City Cemetery Digital Service System</h1><p class="muted">City Government of Bacoor — City Cemetery Office</p><div class="field"><label>Username</label><input value="cemetery.staff"></div><div class="field"><label>Password</label><input type="password" value="demo"></div><button class="btn primary" style="width:100%" onclick="enter('Cemetery Staff')">Sign in</button><div class="demo"><button class="btn soft" onclick="enter('Cemetery Staff')">Demo Staff</button><button class="btn soft" onclick="enter('Supervisor')">Demo Supervisor</button></div><p class="small">Prototype only. Use approved secure authentication and databases for official deployment.</p></div></section>
<div id="app" class="hidden"><div class="shell"><aside class="sidebar"><div class="brand"><b>City Cemetery Office</b><span>City Government of Bacoor</span></div><div class="nav" id="nav"><button data-page="dashboard" class="active">Dashboard</button><button data-page="applications">Applications</button><button data-page="inventory">Burial Map & Niches</button><button data-page="schedule">Schedules</button><button data-page="payments">Payment Orders</button><button data-page="reports">Reports</button></div></aside><main><div class="top"><div><button class="btn soft mobile" onclick="mobileNav()">Menu</button><h2 id="title">Dashboard</h2><span class="small" id="date"></span></div><div class="user"><div class="avatar" id="av">CS</div><div><b id="role">Cemetery Staff</b><div class="small">Signed in</div></div><button class="btn soft" onclick="logout()">Logout</button></div></div><div id="page"></div></main></div></div><div id="modal"></div>
<script>
const SERVICES={
new_lease:{name:'Lease Contract — New Application',who:'City of Bacoor Residents',term:'5 years',req:['Death Certificate with Registry No.','One valid ID with Bacoor address','Transfer Permit Receipt and Certificate, if applicable','For open tomb: prior death certificate / burial record','For open tomb: updated niche photo'],flow:['Document Evaluation','Burial Space Identification','Payment Order','Payment Verification','Lease Contract Preparation','For Signing / Notarization','Ready for Release','Released'],fees:[['Maliksi — New Tomb Apartment',2300],['Molino — Single Lot',15000],['Molino — Apartment Type',5500],['Molino — Vault Type',5500],['Molino — Open Tomb',3900]]},
renewal:{name:'Lease Contract — Renewal Application',who:'City of Bacoor Residents',term:'5 years',req:['Death Certificate with Registry No.','One valid ID with Bacoor address','Updated picture of niche','Copy of Contract and Receipt'],flow:['Document Evaluation','Payment Order','Payment Verification','Lease Contract Preparation','For Signing / Notarization','Ready for Release','Released'],fees:[['Maliksi — Apartment Type',2000],['Molino — Apartment Type',5000],['Molino — Vault Type',5000]]},
columbarium:{name:'Columbarium — New Application',who:'City of Bacoor Residents',term:'5 years',req:['Death Certificate with Registry No.','One valid ID','Certificate of Cremation'],flow:['Document Evaluation','Vault Selection','Payment Order','Payment Verification','Lease Contract Preparation','For Signing / Notarization','Ready for Release','Released'],fees:[['Row 1',2000],['Row 2',2500],['Row 3',5000],['Row 4',10000],['Row 5',10000],['Row 6',10000],['Row 7',5000],['Row 8',4000]]},
cremation:{name:'Cremation Services',who:'Bacoor Residents and Non-Residents',req:['Death Certificate with Registry No.','One valid ID','Transfer Permit Receipt and Certificate, if applicable'],flow:['Document Evaluation','Schedule Cremation','Payment Order','Payment Verification','Cremation Certificate','Released'],fees:[['Bacoor Resident',700],['Non-Resident',1000],['Security Seal',55]]},
bereavement:{name:'Bereavement Room Facility',who:'Bacoor Residents and Non-Residents',req:['Death Certificate with Registry No.','One valid ID'],flow:['Document Evaluation','Schedule Dates','Payment Order','Payment Verification','Confirmed'],fees:[['Rental per day',3000]]},
chapel:{name:'Chapel Facility',who:'Bacoor Residents and Non-Residents',req:['Death Certificate with Registry No.','One valid ID'],flow:['Document Evaluation','Schedule Dates','Payment Order','Payment Verification','Confirmed'],fees:[['Rental per day',5000]]}
};
const seed=[{id:'CEM-2026-000001',service:'new_lease',applicant:'Juan Dela Cruz',deceased:'Maria Dela Cruz',residency:'Bacoor Resident',status:'Document Evaluation',created:'2026-10-13',location:'Maliksi 2',feeOption:'Maliksi — New Tomb Apartment',fee:2300,receipt:'',schedule:'',docs:[]},{id:'CEM-2026-000002',service:'cremation',applicant:'Ana Santos',deceased:'Roberto Santos',residency:'Bacoor Resident',status:'Payment Order',created:'2026-10-13',location:'Molino 2',feeOption:'Bacoor Resident + Security Seal',fee:755,receipt:'',schedule:'2026-10-15',docs:[]}];
const slots0=[{code:'MAL-A-001',site:'Maliksi 2',type:'Apartment',status:'Occupied'},{code:'MAL-A-002',site:'Maliksi 2',type:'Apartment',status:'Available'},{code:'MAL-O-014',site:'Maliksi 2',type:'Open Tomb',status:'Available'},{code:'MOL-S-005',site:'Molino 2',type:'Single Lot',status:'Occupied'},{code:'MOL-A-021',site:'Molino 2',type:'Apartment',status:'Available'},{code:'MOL-V-011',site:'Molino 2',type:'Vault',status:'Reserved'},{code:'COL-R1-004',site:'Molino 2',type:'Columbarium Row 1',status:'Available'}];
let state={page:'dashboard',apps:JSON.parse(localStorage.getItem('cem_apps')||'null')||seed,slots:JSON.parse(localStorage.getItem('cem_slots')||'null')||slots0,counter:+(localStorage.getItem('cem_counter')||3)};
const fmt=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
function save(){localStorage.setItem('cem_apps',JSON.stringify(state.apps));localStorage.setItem('cem_slots',JSON.stringify(state.slots));localStorage.setItem('cem_counter',state.counter)}
function enter(r){login.classList.add('hidden');app.classList.remove('hidden');role.textContent=r;av.textContent=r==='Supervisor'?'SV':'CS';date.textContent=new Date().toLocaleDateString('en-PH',{dateStyle:'full'});render()}
function logout(){app.classList.add('hidden');login.classList.remove('hidden')}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});
function mobileNav(){const p=prompt('Open: dashboard, applications, inventory, schedule, payments, reports',state.page);if(['dashboard','applications','inventory','schedule','payments','reports'].includes(p)){state.page=p;render()}}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));title.textContent={dashboard:'Dashboard',applications:'Applications',inventory:'Burial Map & Niches',schedule:'Schedules',payments:'Payment Orders',reports:'Reports'}[state.page];page.innerHTML=window[state.page]();}
function cls(s){if(s.includes('Payment'))return'payment';if(s.includes('Signing')||s.includes('Preparation'))return'approval';if(s.includes('Ready')||s==='Confirmed')return'ready';if(s==='Released')return'released';if(s.includes('Evaluation')||s.includes('Schedule')||s.includes('Selection')||s.includes('Identification'))return'review';return'pending'}
function appTable(rows){return rows.length?`<div class="tablewrap"><table><thead><tr><th>Reference</th><th>Service</th><th>Applicant / Deceased</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(a=>`<tr><td><b>${a.id}</b><br><span class="small">${a.created}</span></td><td>${SERVICES[a.service].name}</td><td>${a.applicant}<br><span class="small">${a.deceased}</span></td><td><span class="badge ${cls(a.status)}">${a.status}</span></td><td><button class="btn soft" onclick="openApp('${a.id}')">Open</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="small">No records found.</p>'}
function dashboard(){let c={pending:0,payment:0,approval:0,ready:0};state.apps.forEach(a=>{if(a.status.includes('Payment'))c.payment++;else if(a.status.includes('Signing')||a.status.includes('Preparation'))c.approval++;else if(a.status.includes('Ready')||a.status==='Confirmed')c.ready++;else c.pending++});return`<div class="cards"><div class="card"><span class="small">Pending Review</span><div class="metric">${c.pending}</div></div><div class="card"><span class="small">For Payment</span><div class="metric">${c.payment}</div></div><div class="card"><span class="small">For Approval</span><div class="metric">${c.approval}</div></div><div class="card"><span class="small">Ready / Confirmed</span><div class="metric">${c.ready}</div></div></div><div class="grid2"><div class="panel"><div class="toolbar"><button class="btn primary" onclick="openNew()">+ New Application</button></div><h3>Recent Applications</h3>${appTable(state.apps.slice().reverse().slice(0,6))}</div><div class="panel"><h3>Citizen’s Charter Services</h3><div class="services">${Object.entries(SERVICES).map(([k,s])=>`<button class="service" onclick="openNew('${k}')"><b>${s.name}</b><div class="small">${s.who}</div></button>`).join('')}</div><div class="note" style="margin-top:12px">Payment collection remains with the City Finance Department. This system manages the cemetery-office workflow around that official step.</div></div></div>`}
function applications(){return`<div class="panel"><div class="toolbar"><button class="btn primary" onclick="openNew()">+ New Application</button><input id="q" placeholder="Search name or reference" oninput="filterApps()"><select id="f" onchange="filterApps()"><option value="">All services</option>${Object.entries(SERVICES).map(([k,s])=>`<option value="${k}">${s.name}</option>`).join('')}</select></div><div id="tbl">${appTable(state.apps)}</div></div>`}
function filterApps(){let q=document.getElementById('q').value.toLowerCase(),f=document.getElementById('f').value;tbl.innerHTML=appTable(state.apps.filter(a=>(!f||a.service===f)&&[a.id,a.applicant,a.deceased].join(' ').toLowerCase().includes(q)))}
function openNew(k=''){show(`<div class="modalhead"><h3>New Cemetery Service Application</h3><button class="x" onclick="closeM()">✕</button></div><div class="modalbody"><div class="field"><label>Service</label><select id="svc" onchange="serviceFields()"><option value="">Choose service</option>${Object.entries(SERVICES).map(([x,s])=>`<option value="${x}" ${x===k?'selected':''}>${s.name}</option>`).join('')}</select></div><div id="info"></div><div class="formgrid"><div class="field"><label>Applicant / Representative</label><input id="applicant"></div><div class="field"><label>Deceased Person</label><input id="deceased"></div><div class="field"><label>Residency</label><select id="residency"><option>Bacoor Resident</option><option>Non-Resident</option></select></div><div class="field"><label>Contact Number</label><input id="contact"></div><div class="field full"><label>Address</label><input id="address"></div></div><div id="extra"></div></div><div class="modalfoot"><button class="btn soft" onclick="closeM()">Cancel</button><button class="btn primary" onclick="createApp()">Create Application</button></div>`);if(k)serviceFields()}
function serviceFields(){let k=svc.value;if(!k){info.innerHTML='';extra.innerHTML='';return}let s=SERVICES[k];info.innerHTML=`<div class="note ok"><b>${s.name}</b><br>Who may avail: ${s.who}${s.term?' • Lease term: '+s.term:''}</div><h4>Document Checklist</h4><div class="reqs">${s.req.map(r=>`<label class="req"><input type="checkbox" class="doc" value="${r}"><span>${r}</span></label>`).join('')}</div>`;extra.innerHTML=`<div class="field"><label>Service option / fee basis</label><select id="fee"><option value="">Select later</option>${s.fees.map(([n,v])=>`<option value="${n}|${v}">${n} — ${fmt(v)}</option>`).join('')}</select></div>${['cremation','bereavement','chapel'].includes(k)?'<div class="field"><label>Requested date / range</label><input id="sched" placeholder="YYYY-MM-DD or date range"></div>':''}<div class="note">Verify any fee that is ambiguous in the source PDF against the current approved fee schedule before official use.</div>`}
function createApp(){let k=svc.value;if(!k||!applicant.value.trim()||!deceased.value.trim())return alert('Select a service and enter applicant and deceased names.');let x=fee.value?fee.value.split('|'):['',0],amount=+x[1]||0;if(k==='cremation'&&x[0]==='Bacoor Resident')amount=755;if(k==='cremation'&&x[0]==='Non-Resident')amount=1055;let id=`CEM-${new Date().getFullYear()}-${String(state.counter++).padStart(6,'0')}`;state.apps.push({id,service:k,applicant:applicant.value.trim(),deceased:deceased.value.trim(),residency:residency.value,contact:contact.value,address:address.value,status:SERVICES[k].flow[0],created:new Date().toISOString().slice(0,10),location:['columbarium','cremation','bereavement','chapel'].includes(k)?'Molino 2':'',feeOption:x[0],fee:amount,receipt:'',schedule:document.getElementById('sched')?.value||'',docs:[...document.querySelectorAll('.doc:checked')].map(d=>d.value)});save();closeM();render();openApp(id)}
function openApp(id){let a=state.apps.find(x=>x.id===id),s=SERVICES[a.service],i=s.flow.indexOf(a.status);show(`<div class="modalhead"><div><h3 style="margin:0">${a.id}</h3><span class="small">${s.name}</span></div><button class="x" onclick="closeM()">✕</button></div><div class="modalbody"><div class="steps">${s.flow.map((x,n)=>`<span class="step ${n<i?'done':n===i?'current':''}">${x}</span>`).join('')}</div><div class="grid2" style="margin-top:14px"><div class="panel" style="box-shadow:none"><h3>Application</h3><div class="kv"><div>Applicant</div><div>${a.applicant}</div><div>Deceased</div><div>${a.deceased}</div><div>Residency</div><div>${a.residency}</div><div>Location</div><div>${a.location||'To be selected'}</div><div>Schedule</div><div>${a.schedule||'Not scheduled'}</div><div>Fee Basis</div><div>${a.feeOption||'Pending assessment'}</div><div>Amount</div><div><b>${a.fee?fmt(a.fee):'Pending'}</b></div><div>Official Receipt</div><div>${a.receipt||'Not recorded'}</div></div><h4>Requirements</h4><div class="reqs">${s.req.map(r=>`<div class="req">${a.docs.includes(r)?'✅':'⬜'} <span>${r}</span></div>`).join('')}</div></div><div class="panel" style="box-shadow:none"><h3>Actions</h3><div class="field"><label>Status</label><select id="statusEdit">${s.flow.map(x=>`<option ${x===a.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Official Receipt No.</label><input id="receiptEdit" value="${a.receipt||''}"></div><div class="field"><label>Schedule / Date Range</label><input id="scheduleEdit" value="${a.schedule||''}"></div><div class="field"><label>Location / Niche</label><input id="locationEdit" value="${a.location||''}"></div><button class="btn primary" onclick="saveApp('${a.id}')">Save Changes</button> <button class="btn soft" onclick="paymentOrder('${a.id}')">Payment Order</button></div></div></div>`)}
function saveApp(id){let a=state.apps.find(x=>x.id===id);a.status=statusEdit.value;a.receipt=receiptEdit.value.trim();a.schedule=scheduleEdit.value.trim();a.location=locationEdit.value.trim();save();closeM();render();openApp(id)}
function paymentOrder(id){let a=state.apps.find(x=>x.id===id),s=SERVICES[a.service];show(`<div class="modalhead"><h3>Payment Order</h3><button class="x" onclick="closeM()">✕</button></div><div class="modalbody"><div class="printbox"><h2 style="color:var(--navy)">CITY GOVERNMENT OF BACOOR</h2><h3>City Cemetery Office — Payment Order</h3><hr><div class="kv"><div>Reference</div><div>${a.id}</div><div>Service</div><div>${s.name}</div><div>Applicant</div><div>${a.applicant}</div><div>Deceased</div><div>${a.deceased}</div><div>Fee Basis</div><div>${a.feeOption||'For assessment'}</div><div>Amount</div><div><b>${a.fee?fmt(a.fee):'For assessment'}</b></div></div><p class="small">For payment processing by the City Finance Department. This prototype does not collect payment.</p></div></div><div class="modalfoot"><button class="btn primary" onclick="window.print()">Print</button></div>`)}
function inventory(){let g={};state.slots.forEach(x=>(g[x.site]??=[]).push(x));return`<div class="panel"><div class="toolbar"><button class="btn primary" onclick="addSlot()">+ Add Space / Vault</button></div>${Object.entries(g).map(([site,arr])=>`<h3>${site}</h3><div class="inventory">${arr.map(x=>`<div class="slot ${x.status.toLowerCase()}"><b>${x.code}</b><div>${x.type}</div><span class="small">${x.status}</span><br><button class="btn soft" style="margin-top:7px" onclick="cycle('${x.code}')">Change</button></div>`).join('')}</div>`).join('')}</div>`}
function addSlot(){let code=prompt('Space / vault code');if(!code)return;state.slots.push({code,site:prompt('Site','Molino 2')||'Molino 2',type:prompt('Type','Apartment')||'Apartment',status:'Available'});save();render()}
function cycle(code){let x=state.slots.find(s=>s.code===code),o=['Available','Reserved','Occupied'];x.status=o[(o.indexOf(x.status)+1)%3];save();render()}
function schedule(){let rows=state.apps.filter(a=>a.schedule);return`<div class="panel"><h3>Scheduled Services</h3>${rows.length?`<div class="tablewrap"><table><thead><tr><th>Date / Range</th><th>Service</th><th>Reference</th><th>Applicant</th><th>Status</th></tr></thead><tbody>${rows.map(a=>`<tr><td>${a.schedule}</td><td>${SERVICES[a.service].name}</td><td>${a.id}</td><td>${a.applicant}</td><td><span class="badge ${cls(a.status)}">${a.status}</span></td></tr>`).join('')}</tbody></table></div>`:'<p class="small">No scheduled records.</p>'}<div class="note" style="margin-top:12px">Production deployment should enforce double-booking prevention using one shared server database.</div></div>`}
function payments(){let rows=state.apps.filter(a=>a.fee);return`<div class="panel"><h3>Payment Orders & Receipts</h3><div class="tablewrap"><table><thead><tr><th>Reference</th><th>Service</th><th>Amount</th><th>Receipt</th><th></th></tr></thead><tbody>${rows.map(a=>`<tr><td>${a.id}</td><td>${SERVICES[a.service].name}</td><td>${fmt(a.fee)}</td><td>${a.receipt||'<span class="small">Pending</span>'}</td><td><button class="btn soft" onclick="paymentOrder('${a.id}')">Open</button></td></tr>`).join('')}</tbody></table></div></div>`}
function reports(){let t={};Object.keys(SERVICES).forEach(k=>t[k]=0);state.apps.forEach(a=>t[a.service]++);return`<div class="grid2"><div class="panel"><h3>Service Summary</h3>${Object.entries(t).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf0f3"><span>${SERVICES[k].name}</span><b>${v}</b></div>`).join('')}</div><div class="panel"><h3>Export</h3><p class="small">Generate accomplishment data without manually counting logbooks.</p><button class="btn primary" onclick="exportCSV()">Export Applications CSV</button><div class="note ok" style="margin-top:12px">Prototype data is stored in this browser only.</div></div></div>`}
function exportCSV(){let r=[['Reference','Service','Applicant','Deceased','Residency','Status','Created','Location','Schedule','Fee','Receipt'],...state.apps.map(a=>[a.id,SERVICES[a.service].name,a.applicant,a.deceased,a.residency,a.status,a.created,a.location,a.schedule,a.fee,a.receipt])];let csv=r.map(row=>row.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='cemetery-applications.csv';a.click();URL.revokeObjectURL(u)}
function show(html){modal.innerHTML=`<div class="modalback" onclick="if(event.target===this)closeM()"><div class="modal">${html}</div></div>`}function closeM(){modal.innerHTML=''}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
